{% extends "base.html" %}

{% block content %}
<div class="leaderboard-container">
    <h1>Leaderboard</h1>
    <table>
        <thead>
            <tr>
                <th>Rank</th>
                <th>Meme</th>
                <th>Rating</th>
                <th>Wins</th>
                <th>Losses</th>
            </tr>
        </thead>
        <tbody>
            {% for meme in memes %}
            <tr>
                <td>{{ loop.index }}</td>
                <td>
                    <a href="{{ meme.url }}" target="_blank">
                        <img src="{{ meme.url }}" alt="{{ meme.title }}" class="leaderboard-thumb">
                    </a>
                    <span>{{ meme.title }}</span>
                </td>
                <td>{{ meme.elo_rating | round(1) }}</td>
                <td>{{ meme.wins }}</td>
                <td>{{ meme.losses }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
