{% extends "base.html" %}

{% block content %}
<div class="mash-container">
    <h1>Choose the Funniest Meme!</h1>
    <div class="battle-ground">
        <!-- Contestant 1 -->
        <div class="meme-card">
            <img src="{{ meme1.url }}" alt="{{ meme1.title }}">
            <h3>{{ meme1.title }}</h3>
            <!-- <p>Rating: {{ meme1.elo_rating | round(0) }}</p> -->
            <form action="{{ url_for('main.vote') }}" method="POST">
                <input type="hidden" name="winner_id" value="{{ meme1.id }}">
                <input type="hidden" name="loser_id" value="{{ meme2.id }}">
                <button type="submit" class="vote-btn">Vote This One!</button>
            </form>
        </div>

        <div class="vs">VS</div>

        <!-- Contestant 2 -->
        <div class="meme-card">
            <img src="{{ meme2.url }}" alt="{{ meme2.title }}">
            <h3>{{ meme2.title }}</h3>
            <!-- <p>Rating: {{ meme2.elo_rating | round(0) }}</p> -->
            <form action="{{ url_for('main.vote') }}" method="POST">
                <input type="hidden" name="winner_id" value="{{ meme2.id }}">
                <input type="hidden" name="loser_id" value="{{ meme1.id }}">
                <button type="submit" class="vote-btn">Vote This One!</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
